[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bndb"
version = "0.1.0"
description = "Binance abnormal-move research toolkit with SQLite storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.33.1",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]

[project.scripts]
bndb = "bndb.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bndb = ["definitions/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bndb"
version = "0.1.0"
description = "Binance futures abnormal-move research toolkit with SQLite storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
bndb = "bndb.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

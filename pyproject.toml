[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bndb"
version = "0.1.0"
description = "Binance market data toolkit with pandas processing and SQLite storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==3.0.2",
    "requests==2.33.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]

[project.scripts]
bndb = "bndb.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
